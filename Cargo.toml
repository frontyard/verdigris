[package]
name = "verd"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A simple, fast web server and reverse proxy: static files, TLS/ACME, caching, and load balancing in one static binary."
repository = "https://github.com/frontyard/verdigris"
keywords = ["web-server", "reverse-proxy", "http", "tls", "acme"]
categories = ["network-programming"]

[lib]
name = "verd"
path = "src/lib.rs"

[[bin]]
name = "verd"
path = "src/main.rs"

[dependencies]
# Async runtime & HTTP core
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "signal",
    "fs",
    "io-util",
    "macros",
    "sync",
    "process",
] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
    "server",
    "server-auto",
    "server-graceful",
    "client",
    "client-legacy",
    "tokio",
    "http1",
    "http2",
] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
pin-project-lite = "0.2"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec", "io", "net", "rt"] }
memmap2 = "0.9"

# TLS & ACME
rustls = { version = "0.23", features = ["std", "logging", "tls12"] }
tokio-rustls = "0.26"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "tls12",
    "webpki-tokio",
    "aws-lc-rs",
    "logging",
] }
webpki-roots = "1"
instant-acme = { version = "0.8", features = [
    "hyper-rustls",
    "rcgen",
    "x509-parser",
    "time",
    "aws-lc-rs",
] }
rcgen = "0.14"
x509-parser = "0.18"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
schemars = "1"
humantime = "2"
regex = "1"
ipnet = "2"
percent-encoding = "2"
form_urlencoded = "1"
base64 = "0.23"

# Routing
matchit = "0.9"

# Admin API
axum = "0.8"

# Middleware & features
argon2 = "0.6"
bcrypt = "0.19"
subtle = "2"
mime_guess = "2"
httpdate = "1"
ahash = "0.8"
dashmap = "6"
arc-swap = "1"
async-compression = { version = "0.4", features = [
    "tokio",
    "gzip",
    "brotli",
    "zstd",
] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
uuid = { version = "1", features = ["v4"] }

# DNS re-resolution for upstreams
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }

# Config & certificate file watch
notify = "8"

# Errors & time
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

# CLI
clap = { version = "4", features = ["derive", "cargo", "env"] }
serde_path_to_error = "0.1.20"

[[bench]]
name = "hot_paths"
harness = false

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "json",
] }
tokio-tungstenite = "0.30"
tempfile = "3"
proptest = "1"
assert_cmd = "2"
portpicker = "0.1"
divan = { version = "6", package = "codspeed-divan-compat" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# .deb package built by `cargo deb --no-build --target <triple>` in the
# release workflow — it wraps the already-built musl binary, so
# `target/release/verd` below is cargo-deb's placeholder rewritten to
# `target/<triple>/release/verd`. systemd-units requires
# maintainer-scripts to be set; scripts there must keep the #DEBHELPER#
# token where generated systemd fragments are inserted.
[package.metadata.deb]
maintainer = "Nedim <intestellafella@gmail.com>"
copyright = "2026, Verdigris contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Verdigris (verd) is a single-binary web server and reverse proxy: \
static files, TLS with automatic ACME certificates, response caching, \
and upstream load balancing.

The package installs a hardened systemd unit that runs as the `verd` \
system user. The default /etc/verd/verd.toml binds port 80 and answers \
404/421 until sites are configured; state lives in /var/lib/verd and \
logs in /var/log/verd."""
depends = "$auto, adduser, init-system-helpers (>= 1.51)"
section = "httpd"
priority = "optional"
assets = [
    ["target/release/verd", "usr/bin/", "755"],
    ["packaging/verd.toml", "etc/verd/verd.toml", "644"],
    ["README.md", "usr/share/doc/verd/README.md", "644"],
    ["LICENSE-APACHE", "usr/share/doc/verd/LICENSE-APACHE", "644"],
    ["LICENSE-MIT", "usr/share/doc/verd/LICENSE-MIT", "644"],
]
maintainer-scripts = "packaging/debian/"
systemd-units = { unit-scripts = "packaging/" }

# .rpm package built by `cargo generate-rpm --target <triple>
# --arch <rpm-arch>` in the release workflow. Same asset-path
# convention as cargo-deb: target/release/verd is rewritten to
# target/<triple>/release/verd. The tool never builds — it only
# assembles, so the .rpm wraps the same CI musl binary.
# Scriptlets live in packaging/rpm/ (file paths, not inline scripts);
# they mirror the debian/ scripts but follow rpm scriptlet semantics
# ($1 = package count) and systemd preset policy instead of d-s-h.
[package.metadata.generate-rpm]
release = "1"
vendor = "Verdigris contributors"
requires = { systemd = "*", "/usr/sbin/groupadd" = "*", "/usr/sbin/useradd" = "*" }
assets = [
    { source = "target/release/verd", dest = "/usr/bin/verd", mode = "755" },
    { source = "packaging/verd.toml", dest = "/etc/verd/verd.toml", mode = "644", config = "noreplace" },
    { source = "packaging/verd.service", dest = "/usr/lib/systemd/system/verd.service", mode = "644" },
    # NOTE: { dir = true } assets are broken in cargo-generate-rpm
    # 0.21.x (empty source → ENOENT). /var/lib/verd + /var/log/verd are
    # created by %post instead, like the deb postinst.
    { source = "README.md", dest = "/usr/share/doc/verd/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/verd/LICENSE", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/verd/LICENSE-APACHE", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/verd/LICENSE-MIT", mode = "644" },
]
pre_install_script = "packaging/rpm/preinstall.sh"
post_install_script = "packaging/rpm/postinstall.sh"
pre_uninstall_script = "packaging/rpm/preuninstall.sh"
post_uninstall_script = "packaging/rpm/postuninstall.sh"
