name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 4 * * 3" # weekly, Wednesday 04:15 UTC

permissions: {}

jobs:
  analyze:
    name: codeql (rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none # rust extractor needs no build
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
