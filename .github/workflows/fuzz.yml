name: Fuzz

on:
  workflow_dispatch:
  pull_request:
    paths: ["fuzz/**", "src/**"]
  schedule:
    - cron: "0 4 * * 0" # weekly, sunday 04:00 UTC

permissions: {}

jobs:
  soak:
    if: github.event_name == 'schedule'
    name: soak (rss)
    runs-on: ubuntu-latest
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --test fault -- --ignored --nocapture

  smoke:
    name: smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions: {contents: read} # checkout
    env:
      # rust-toolchain.toml pins "stable"; cargo-fuzz needs nightly -Z flags
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      matrix:
        target:
          - config_parse
          - path_normalize
          - route_match
          - cache_index
          - http_semantics
          - headers_policy
          - static_resolve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - run: cargo install cargo-fuzz --locked
      - name: short fuzz run
        run: cargo fuzz run "$TARGET" -- -max_total_time="$FUZZ_TIME" -artifact_prefix=/tmp/
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_TIME: ${{ github.event_name == 'schedule' && 900 || 60 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: /tmp/crash-*
