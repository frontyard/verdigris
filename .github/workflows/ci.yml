name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read} # checkout
    env:
      # rust-toolchain.toml pins "stable"; env var takes precedence so
      # the 1.88 leg actually runs 1.88
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      matrix:
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read} # checkout
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      matrix:
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - run: cargo nextest run --all-targets
      - run: cargo test --doc

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  generated:
    name: generated docs in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # same checks as docs.yml, but on every PR — schema/docs drift
      # doesn't only come from docs/** paths. check-snippets runs here too:
      # a src/config-only PR can break doc snippets without touching docs/.
      - run: |
          cargo run --quiet -- schema | python3 docs/gen-reference.py > docs/book/src/reference.md
          python3 docs/gen-llms-full.py
          python3 docs/check-snippets.py target/debug/verd
          git diff --exit-code docs/book/src/reference.md llms-full.txt || {
            echo "::error::generated docs are stale — run:"
            echo "  cargo run -- schema | python3 docs/gen-reference.py > docs/book/src/reference.md"
            echo "  python3 docs/gen-llms-full.py"
            exit 1
          }

  package:
    name: cargo publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo publish --dry-run --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny
      - run: cargo deny check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: coverage report + soft gate
        run: |
          cargo llvm-cov --all-targets --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only --fail-under-lines 55
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
      # advisory — a codecov outage must never gate a PR; upload is
      # authenticated via the CODECOV_TOKEN repo secret
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-machete
      - run: cargo machete

  semver:
    name: semver-checks (API breaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # advisory — 0.x versions may legitimately break the lib API between
    # minor bumps; the report surfaces the required bump so the release
    # number is a decision, not a surprise. Flip to gating at 1.0.
    # continue-on-error alone isn't advisory: the check still reports a
    # failure conclusion on the PR. The step exits 0 instead, emitting a
    # warning annotation + the full report in the job summary.
    continue-on-error: true
    permissions: {contents: read} # checkout + tag history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # baseline is the newest stable tag
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-semver-checks
      - run: |
          base="$(git tag --list 'v*' --sort=-version:refname | grep -v -- '-' | head -1)"
          if [ -z "$base" ]; then
            echo "no release tag yet — nothing to compare against"
            exit 0
          fi
          echo "baseline: $base"
          set +e
          cargo semver-checks check-release --baseline-rev "$base" 2>&1 | tee /tmp/semver.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 100 ]; then
            echo "::warning::semver-checks: API breaks vs $base — next release needs a version bump accordingly (see job summary)"
            { echo "## semver-checks vs $base"; echo '```'; sed 's/\x1b\[[0-9;]*m//g' /tmp/semver.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::semver-checks did not run to completion (exit $rc)"
          fi

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read} # checkout + GH_TOKEN audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor
      - run: zizmor .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
