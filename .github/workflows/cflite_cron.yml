name: ClusterFuzzLite cron tasks

on:
  schedule:
    - cron: "31 5 * * 0" # weekly, sunday 05:31 UTC (after the batch run)
  workflow_dispatch:

permissions: {}

env:
  STORAGE_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

jobs:
  prune:
    name: corpus prune
    runs-on: ubuntu-latest
    concurrency:
      # serializes against the batch job, which writes the same branch
      group: cflite-corpus
      cancel-in-progress: false
    permissions:
      contents: write # push the minimized corpus to the storage branch
      security-events: write # SARIF upload to code scanning
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        id: build
        with:
          language: rust
          sanitizer: ${{ matrix.sanitizer }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: corpus
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        id: run
        with:
          language: rust
          sanitizer: ${{ matrix.sanitizer }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune
          output-sarif: true
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: corpus

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    concurrency:
      group: cflite-corpus
      cancel-in-progress: false
    permissions:
      contents: write # push the report to the `coverage` branch
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        id: build
        with:
          language: rust
          sanitizer: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: corpus
          storage-repo-branch-coverage: coverage
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        id: run
        with:
          language: rust
          sanitizer: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: corpus
          storage-repo-branch-coverage: coverage
