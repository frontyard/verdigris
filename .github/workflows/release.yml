name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          lookup-only: true # release builds read caches but never write them
      - run: cargo install cross --locked
      - name: build static binary
        run: cross build --release --locked --target ${{ matrix.target }}
        env:
          # baked into the binary: /version and --version report it
          VERD_GIT_SHA: ${{ github.sha }}
      - name: package artifact
        run: |
          t=${{ matrix.target }}
          mkdir -p dist/$t
          cp target/$t/release/verd dist/$t/verd
          strip dist/$t/verd || true
          tar -C dist/$t -czf verd-$t.tar.gz verd
          sha256sum verd-$t.tar.gz >> checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            verd-*.tar.gz
            checksums.txt
            dist/

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-sbom
      - run: cargo sbom > verd-sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: verd-sbom.json

  release:
    name: release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub release
      id-token: write # cosign keyless signing + attestation OIDC
      actions: read # download-artifact
      attestations: write # upload SLSA provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      # one checksums.txt: each matrix leg appended its own line
      - run: sort -u checksums.txt -o checksums.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign artifacts (keyless)
        run: |
          for f in verd-*.tar.gz checksums.txt verd-sbom.json; do
            cosign sign-blob --yes "$f" \
              --bundle "$f.cosign.bundle"
          done
      # curated notes come from the CHANGELOG.md section matching the
      # tag; generated "What's Changed" is appended below it
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            awk -v head="## [${v}]" '
              index($0, head) == 1 { on = 1; next }
              /^## \[/ && on { exit }
              /^\[[^]]+\]:/ { next }   # keepachangelog link refs
              on' CHANGELOG.md
            printf '\n---\n%s\n' "Static musl binaries for x86_64 and aarch64 Linux, plus a multi-arch container image (ghcr.io). Artifacts are cosign keyless-signed; verd-sbom.json is the CycloneDX SBOM."
          } > notes.md
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "verd-*.tar.gz"
      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: |
            verd-*.tar.gz
            checksums.txt
            verd-sbom.json
            *.cosign.bundle
          generate_release_notes: true
          body_path: notes.md

  image:
    name: image
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout + artifact metadata
      actions: read # download-artifact
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      # regroup per-arch binaries under dist/<docker-arch>/
      - run: |
          mkdir -p dist/amd64 dist/arm64
          cp dist/x86_64-unknown-linux-musl/verd dist/amd64/
          cp dist/aarch64-unknown-linux-musl/verd dist/arm64/
          # upload/download-artifact strips file modes — restore exec bit
          chmod +x dist/amd64/verd dist/arm64/verd
          cp Dockerfile.release dist/Dockerfile.release
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: dist/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
