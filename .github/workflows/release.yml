name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: existing vX.Y.Z tag to release
        required: true

permissions: {}

concurrency:
  # per-tag groups: same-tag releases serialize; different tags run in
  # parallel. A shared "release" group would let a third run silently drop
  # the one pending tag (GitHub holds at most one queued run per group).
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          lookup-only: true # release builds read caches but never write them
      - run: cargo install cross --locked
      # The step env below applies to the host `cross` process too, so
      # host-side cargo probes (cargo metadata / rustc -vV) must be able
      # to resolve the wrapper binary — install it on the host as well
      # (the musl build is fully static and runs on glibc fine).
      - name: install cargo-auditable (host)
        run: |
          curl -sSfL -o /tmp/ca.tar.xz https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.7/cargo-auditable-x86_64-unknown-linux-musl.tar.xz
          echo '7676443367c5e33d9fb22acef63cccb5e9202de12dae1b0579995eb3e2bc7a18  /tmp/ca.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ca.tar.xz -C /tmp
          install -m755 /tmp/cargo-auditable-x86_64-unknown-linux-musl/cargo-auditable "$HOME/.cargo/bin/"
      - name: build static binary
        run: cross build --release --locked --target ${{ matrix.target }}
        env:
          # baked into the binary: /version and --version report it
          VERD_GIT_SHA: ${{ steps.checkout.outputs.commit }}
          # Cross.toml pre-build installs cargo-auditable in the
          # container; the wrapper embeds dependency metadata
          # (.dep-v0) into the shipped binary. Both vars are required:
          # the wrapper refuses to run unless CARGO_AUDITABLE_ORIG_ARGS
          # is set — `cargo auditable` normally provides it as JSON; we
          # replicate the same serialized CargoArgs for this invocation.
          RUSTC_WORKSPACE_WRAPPER: cargo-auditable
          CARGO_AUDITABLE_ORIG_ARGS: '{"offline":false,"locked":true,"frozen":false,"config":[]}'
      - name: package artifact
        run: |
          t=${{ matrix.target }}
          mkdir -p dist/$t
          cp target/$t/release/verd dist/$t/verd
          strip dist/$t/verd || true
          tar -C dist/$t -czf verd-$t.tar.gz verd
          sha256sum verd-$t.tar.gz >> checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            verd-*.tar.gz
            checksums.txt
            dist/

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-sbom
      - run: cargo sbom > verd-sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: verd-sbom.json

  release:
    name: release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # publish the GitHub release
      id-token: write # cosign keyless signing + attestation OIDC
      actions: read # download-artifact
      attestations: write # upload SLSA provenance
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # egress audit on the job holding OIDC + signing powers — logs
      # outbound traffic; flip to `block` + allowlist once baselined
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      # one checksums.txt: each matrix leg appended its own line
      - run: sort -u checksums.txt -o checksums.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign artifacts (keyless)
        run: |
          for f in verd-*.tar.gz checksums.txt verd-sbom.json; do
            cosign sign-blob --yes "$f" \
              --bundle "$f.cosign.bundle" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done
      # curated notes come from the CHANGELOG.md section matching the
      # tag; generated "What's Changed" is appended below it
      - name: release notes from CHANGELOG.md
        run: |
          v="${RELEASE_TAG#v}"
          {
            awk -v head="## [${v}]" '
              index($0, head) == 1 { on = 1; next }
              /^## \[/ && on { exit }
              /^\[[^]]+\]:/ { next }   # keepachangelog link refs
              on' CHANGELOG.md
            printf '\n---\n%s\n' "Static musl binaries for x86_64 and aarch64 Linux, plus a multi-arch container image (ghcr.io). Artifacts are cosign keyless-signed; verd-sbom.json is the CycloneDX SBOM."
          } > notes.md
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "verd-*.tar.gz"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # zizmor: ignore[superfluous-actions] curated body_path notes are deliberate
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            verd-*.tar.gz
            checksums.txt
            verd-sbom.json
            *.cosign.bundle
            *.sig
            *.pem
          generate_release_notes: true
          body_path: notes.md

  image:
    name: image
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout + artifact metadata
      actions: read # download-artifact
      packages: write # push to GHCR
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # egress audit on the job that authenticates to GHCR
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      # regroup per-arch binaries under dist/<docker-arch>/
      - run: |
          mkdir -p dist/amd64 dist/arm64
          cp dist/x86_64-unknown-linux-musl/verd dist/amd64/
          cp dist/aarch64-unknown-linux-musl/verd dist/arm64/
          # upload/download-artifact strips file modes — restore exec bit
          chmod +x dist/amd64/verd dist/arm64/verd
          cp Dockerfile.release dist/Dockerfile.release
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `latest` is shared mutable state across tags — only the run whose
      # tag is the newest may move it, so a concurrent (or re-run) release
      # of an older tag can't regress the image users pull
      - name: resolve image tags
        id: tags
        run: |
          git fetch --tags --force --quiet
          # `latest` follows the newest *stable* tag — prerelease tags
          # (vX.Y.Z-…) are excluded so they never move it
          newest="$(git tag --list 'v*' --sort=-version:refname | grep -v -- '-' | head -1)"
          echo "newest stable tag: $newest — releasing: $RELEASE_TAG"
          {
            echo "ghcr.io/${{ github.repository }}:${RELEASE_TAG}"
            if [ "$newest" = "$RELEASE_TAG" ]; then
              echo "ghcr.io/${{ github.repository }}:latest"
            fi
          } > tags.txt
          cat tags.txt
          if [ "$newest" != "$RELEASE_TAG" ]; then
            echo "::warning::$RELEASE_TAG is not the newest stable tag ($newest); 'latest' is unchanged"
          fi
          {
            echo 'list<<EOF'
            cat tags.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist
          file: dist/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
