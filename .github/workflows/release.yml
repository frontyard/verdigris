name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # cosign keyless signing

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - name: build static binary
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: package artifact
        run: |
          t=${{ matrix.target }}
          mkdir -p dist/$t
          cp target/$t/release/verd dist/$t/verd
          strip dist/$t/verd || true
          tar -C dist/$t -czf verd-$t.tar.gz verd
          sha256sum verd-$t.tar.gz >> checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            verd-*.tar.gz
            checksums.txt
            dist/

  sbom:
    name: cargo-sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-sbom
      - run: cargo sbom > verd-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: verd-sbom.json

  release:
    name: github release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      # one checksums.txt: each matrix leg appended its own line
      - run: sort -u checksums.txt -o checksums.txt
      - uses: sigstore/cosign-installer@v3
      - name: sign artifacts (keyless)
        run: |
          for f in verd-*.tar.gz checksums.txt verd-sbom.json; do
            cosign sign-blob --yes "$f" \
              --bundle "$f.cosign.bundle"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            verd-*.tar.gz
            checksums.txt
            verd-sbom.json
            *.cosign.bundle
          generate_release_notes: true
          # crates.io: the package publishes as `verd`; binaries and
          # images are the primary distribution channel.
          body: |
            Static musl binaries for x86_64 and aarch64 Linux, plus a
            multi-arch container image (ghcr.io). Artifacts are cosign
            keyless-signed; `verd-sbom.json` is the CycloneDX SBOM.

  image:
    name: container image
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      # regroup per-arch binaries under dist/<docker-arch>/
      - run: |
          mkdir -p dist/amd64 dist/arm64
          cp dist/x86_64-unknown-linux-musl/verd dist/amd64/
          cp dist/aarch64-unknown-linux-musl/verd dist/arm64/
          cp Dockerfile.release dist/Dockerfile.release
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dist
          file: dist/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
