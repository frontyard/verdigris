name: Weekly

# Slow/advisory matrix checks that would be noise per-PR: the test
# suite under the release profile (no debug_assertions, no overflow
# checks — a different failure surface) and on the nightly toolchain
# (catches rustc regressions before they reach stable users).

on:
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * 2" # weekly, Tuesday 06:10 UTC

permissions: {}

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  release-mode:
    name: test --release (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-mode
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - run: cargo nextest run --release --all-targets

  nightly:
    name: test (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # rustc bugs/regressions upstream are not our PRs to fix — advisory
    continue-on-error: true
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: nightly
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - run: cargo nextest run --all-targets
