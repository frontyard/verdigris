name: Mutants

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 3" # weekly, Wednesday 05:20 UTC

permissions: {}

concurrency:
  group: mutants
  cancel-in-progress: false

jobs:
  mutants:
    name: cargo-mutants sweep
    runs-on: ubuntu-latest
    timeout-minutes: 100 # partial sweep — results are per-mutant
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-mutants, cargo-nextest
      # shuffled so each week's time-capped run covers a different slice;
      # mutants.out appends per-mutant verdicts as it goes
      - run: cargo mutants --test-tool=nextest --jobs 2 --shuffle
        continue-on-error: true # a surviving mutant is signal, not a gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore
