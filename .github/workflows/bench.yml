name: Bench

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y wrk nginx
      - name: verd vs nginx
        run: BENCH_DUR=15s ./bench/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results.json
