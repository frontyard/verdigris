name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "llms.txt", "src/config/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "llms.txt", ".github/workflows/docs.yml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: mdbook
      # the book title carries the crate version — release.sh keeps it
      # in sync; guard here so a manual Cargo.toml bump can't drift it
      - run: |
          v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          grep -q "title = \"Verdigris v$v\"" docs/book/book.toml || {
            echo "::error::docs/book/book.toml title is stale; expected 'Verdigris v$v' (run release.sh)"
            exit 1
          }
          grep -q "Documentation for verd $v" docs/book/src/introduction.md || {
            echo "::error::docs/book/src/introduction.md version line is stale; expected 'verd $v'"
            exit 1
          }
      # config reference is generated from the live schema
      - run: cargo run --quiet -- schema | python3 docs/gen-reference.py > docs/book/src/reference.md
      - run: |
          git diff --exit-code docs/book/src/reference.md || {
            echo "::error::reference.md is stale; regenerate: verd schema | python3 docs/gen-reference.py"
            exit 1
          }
      # every TOML snippet in the docs and llms.txt must validate
      - run: cargo build --quiet --release
      - run: python3 docs/check-snippets.py
      - run: python3 docs/gen-llms-full.py
      - run: mdbook build docs/book
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: docs/book/book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # pages OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
