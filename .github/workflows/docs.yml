name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "llms.txt", "src/config/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "llms.txt", ".github/workflows/docs.yml"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@aafe37d8c52b7112a59ade7606c9d466fc6290cb # mdbook
      # config reference is generated from the live schema
      - run: cargo run --quiet -- schema | python3 docs/gen-reference.py > docs/book/src/reference.md
      - run: |
          git diff --exit-code docs/book/src/reference.md || {
            echo "::error::reference.md is stale; regenerate: verd schema | python3 docs/gen-reference.py"
            exit 1
          }
      # every TOML snippet in the docs and llms.txt must validate
      - run: cargo build --quiet --release
      - run: python3 docs/check-snippets.py
      - run: python3 docs/gen-llms-full.py
      - run: mdbook build docs/book
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: docs/book/book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # pages OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
