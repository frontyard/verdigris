*:8380 {
    log #false
    compressed #false
    location /m3u8 {
        cache {
            max_response_size 2097152
        }
        proxy http://127.0.0.1:8480/m3u8
    }
    location / {
        root /srv/www
    }
}

*:11443 {
    tls CERTDIR/bench.crt CERTDIR/bench.key
    log #false
    compressed #false
    location /m3u8 {
        cache {
            max_response_size 2097152
        }
        proxy http://127.0.0.1:8480/m3u8
    }
    location / {
        root /srv/www
    }
}
