worker_processes auto;
worker_cpu_affinity auto;
pid /tmp/verd-bench-nginx.pid;
error_log /tmp/verd-bench-nginx.err warn;
events {
    worker_connections 8192;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # Body-cache zones — nginx's real HTTP cache (proxy_cache). The "mem"
    # zone sits on tmpfs (NGINXMEMDIR): nginx has no pure-RAM body cache,
    # this is the standard ramdisk approach; the mechanism is unchanged.
    proxy_cache_path NGINXMEMDIR levels=1:2 keys_zone=mem:64m max_size=512m inactive=5m;
    proxy_cache_path NGINXDISKDIR levels=1:2 keys_zone=disk:64m max_size=2g inactive=5m;

    server {
        listen 127.0.0.1:8180 reuseport;
        location /raw/ {
            alias WWWDIR/raw/;
        }
        location /m3u8/ {
            proxy_pass http://127.0.0.1:8480;
            proxy_cache mem;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            proxy_cache_valid 200 1s;
            add_header X-Cache-Status $upstream_cache_status always;
        }
        location /ts/ {
            proxy_pass http://127.0.0.1:8480;
            proxy_cache disk;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            proxy_cache_valid 200 5m;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
    server {
        listen 127.0.0.1:9443 ssl reuseport;
        ssl_certificate CERTDIR/bench.crt;
        ssl_certificate_key CERTDIR/bench.key;
        ssl_session_cache shared:benchssl:10m;
        location /raw/ {
            alias WWWDIR/raw/;
        }
        location /m3u8/ {
            proxy_pass http://127.0.0.1:8480;
            proxy_cache mem;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            proxy_cache_valid 200 1s;
            add_header X-Cache-Status $upstream_cache_status always;
        }
        location /ts/ {
            proxy_pass http://127.0.0.1:8480;
            proxy_cache disk;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            proxy_cache_valid 200 5m;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
